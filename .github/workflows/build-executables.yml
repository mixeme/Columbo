name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pyinstaller

      - name: Clean build outputs
        shell: pwsh
        run: |
          Remove-Item -LiteralPath build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath dist -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build executable
        shell: cmd
        run: scripts\build-win.bat

      - name: Verify executable
        id: windows_executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath dist -Filter "*.exe" -File
          if (-not $exe) {
            throw "Windows executable was not created in dist"
          }
          if ($exe.Count -ne 1) {
            throw "Expected exactly one Windows executable, found $($exe.Count)"
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          $exe | Format-Table Name, Length

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.windows_executable.outputs.path }}
          archive: false
          if-no-files-found: error

  linux:
    name: Linux executable (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: deb11
            dockerfile: Dockerfile-deb11
            image: columbo:debian-bullseye-ci
            base_dockerfile: ""
            base_image: ""
          - target: deb10
            dockerfile: Dockerfile-deb10
            image: columbo:debian-buster-ci
            base_dockerfile: ""
            base_image: ""
          - target: centos7
            dockerfile: Dockerfile-centos7
            image: columbo:centos-7-ci
            base_dockerfile: Dockerfile-centos7-python
            base_image: mixeme/columbo:centos-7-python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean build outputs
        run: rm -rf build dist

      - name: Build base Docker image
        if: matrix.base_dockerfile != ''
        run: docker build --tag "${{ matrix.base_image }}" --file "scripts/docker/${{ matrix.base_dockerfile }}" scripts/docker

      - name: Build Docker image
        run: docker build --tag "${{ matrix.image }}" --file "scripts/docker/${{ matrix.dockerfile }}" scripts/docker

      - name: Build executable
        run: |
          docker run \
            --user "$(id -u):$(id -g)" \
            --rm \
            --volume "$PWD:/project" \
            --volume /etc/passwd:/etc/passwd:ro \
            --volume /etc/group:/etc/group:ro \
            --volume /etc/shadow:/etc/shadow:ro \
            --env TAG="${{ matrix.target }}" \
            "${{ matrix.image }}" \
            bash /project/scripts/build-lnx.sh onefile

      - name: Verify executable
        id: linux_executable
        run: |
          executable="$(find dist -maxdepth 1 -type f -name 'columbo-*' ! -name '*.tar.gz' -print -quit)"
          if [ -z "$executable" ]; then
            echo "Linux executable was not created in dist"
            exit 1
          fi
          count="$(find dist -maxdepth 1 -type f -name 'columbo-*' ! -name '*.tar.gz' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Linux executable, found $count"
            find dist -maxdepth 1 -type f -name 'columbo-*' ! -name '*.tar.gz' -exec ls -lh {} \;
            exit 1
          fi
          echo "path=$executable" >> "$GITHUB_OUTPUT"
          ls -lh "$executable"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.linux_executable.outputs.path }}
          archive: false
          if-no-files-found: error
